---
name: ci

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    # Publish `main` as Docker `latest` image.
    branches:
      - main
  # Run tests for PRs
  pull_request:

env:
  GORELEASER_VER: "v2.18.2"
  GOLANGCI-LINT_VER: "v2.14.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - .
          - middleware/ginz
          - middleware/gorillaz
          - middleware/grpcz
          - middleware/httpz
          - middleware/humaz
          - examples/middleware/http/gin
          - examples/middleware/http/gorilla
          - examples/middleware/http/huma

    steps:
      -
        uses: actions/checkout@v7
      -
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      -
        name: Lint ginz
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI-LINT_VER }}
          args: --timeout=5m
          working-directory: ${{ matrix.module }}
  test:
    runs-on: ubuntu-latest
    steps:
      -
        uses: actions/checkout@v7
      -
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      -
        name: Test Setup
        run: |
          make install-gotestsum
      -
        name: Test
        run: |
          .ext/bin/gotestsum --format short-verbose -- -count=1 -v -timeout=240s -coverprofile=cover.out -coverpkg=./... ./...
      -
        name: Build Examples
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VER }}
          args: build --clean --snapshot --single-target
      -
        name: Upload code coverage
        uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          path-to-profile: cover.out

  release:
    needs: [test]
    runs-on: ubuntu-latest
    # Only release when ref is a tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      -
        uses: actions/checkout@v7
      -
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      -
        name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Release
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VER }}
          args: release --clean
